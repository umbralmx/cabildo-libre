name: Procesar actas (Fase 2 — OCR + resúmenes)

# La mitad pesada del proyecto: OCR de los PDF escaneados y resúmenes en lenguaje
# llano. Corre por lotes (no en cada push) y va llenando el corpus unas actas por
# corrida — ambas etapas son idempotentes, así que reintentar es seguro y barato.
#
# Requiere el secreto DEEPSEEK_API_KEY para la etapa de resúmenes. Sin él, la etapa
# de OCR corre igual (es gratis) y los resúmenes se saltan.

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Período a procesar"
        default: "2024-2027"
      lote:
        description: "Máximo de actas por corrida"
        default: "10"
      resumir_forzar:
        description: "Re-generar resúmenes ya existentes (para actualizar el esquema Tier A)"
        type: boolean
        default: false
      solo_resumenes:
        description: "Saltar el OCR y sólo re-resumir lo ya OCR'd (para el pase enriquecido)"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 6" # sábados 1:00 Colima, fuera de horas pico

permissions:
  contents: write

concurrency:
  group: procesar
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Tesseract (español) y PyMuPDF
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
          pip install -r processor/requirements.txt

      - name: OCR (gratis, un lote)
        if: ${{ github.event.inputs.solo_resumenes != 'true' }}
        run: |
          python3 processor/ocr_colima.py \
            --periodo "${{ github.event.inputs.periodo || '2024-2027' }}" \
            --limit "${{ github.event.inputs.lote || '10' }}"

      - name: Resúmenes (DeepSeek) — sólo si hay llave
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: |
          python3 processor/summarize_colima.py \
            --limit "${{ github.event.inputs.lote || '10' }}" \
            ${{ github.event.inputs.resumir_forzar == 'true' && '--force' || '' }}

      - name: Asistencia por sesión (pase de lista, sin API)
        run: python3 processor/asistencia_colima.py

      - name: Compilar payloads del sitio (summaries.json + fulltext.json)
        run: python3 processor/build_site_index.py

      - name: Compilar analítica por administración (Fase 3)
        run: python3 processor/build_analytics.py

      - name: Commitear lo procesado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ocr data/summaries data/asistencia site/summaries.json site/fulltext.json site/analytics-*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "fase 2: procesar lote $(date -u +%F)"
          # Un lote tarda una hora larga. Si algo más entró a main mientras tanto, un push
          # a secas se rechaza y el lote se pierde entero —una hora de OCR y de llamadas ya
          # pagadas— por un conflicto que no existe: nadie más escribe en data/ocr,
          # data/summaries ni data/asistencia. Se rebasa y se reintenta.
          for intento in 1 2 3; do
            git push && exit 0
            echo "push rechazado (intento $intento); rebasando sobre origin/main"
            git pull --rebase origin main
          done
          git push

  # El lote commitea con el GITHUB_TOKEN, y GitHub a propósito no dispara workflows
  # con esos push. Se intentó despertar a `actualizar.yml` con un gatillo
  # `workflow_run`: no llega el evento —probado dos veces el 2026-07-25, con el
  # archivo ya asentado en main y los nombres idénticos— así que el lote publica
  # por su cuenta. Son tres pasos y no dependen de que GitHub entregue un evento.
  publicar:
    needs: procesar
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Mismo grupo que `actualizar.yml`: dos despliegues a Pages hacen cola, no se pisan.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `main`, no el SHA que arrancó el job: lo que se publica es el commit del lote.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
