name: Actualizar datos y publicar

on:
  schedule:
    - cron: "0 14 * * 1,4" # lunes y jueves 8:00 Colima
  push:
    branches: [main]
  # Aquí vivía un gatillo `workflow_run` para publicar al terminar un lote. No
  # funciona: el evento no llega nunca (probado el 2026-07-25). Ahora `procesar.yml`
  # publica al final de su propio lote, así que este workflow sólo re-scrapea.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# El scrape escribe en git, así que dos corridas no deben solaparse y ninguna
# debe cancelarse a media escritura. El grupo de despliegue va en el job
# `publicar`, no aquí: cuando estaba a nivel de workflow, un push podía cancelar
# un re-scrapeo en curso.
concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    # El re-scrapeo corre programado o a mano. En push y al terminar un lote de
    # procesamiento sólo se publica: los datos ya están en el repo.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-scrapear el índice de actas
        run: python3 scraper/scrape_colima.py
      - name: Commitear datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/actas.json data/actas.csv site/actas.json site/actas.csv
          git diff --cached --quiet || git commit -m "datos: actualización automática $(date -u +%F)"
          git push

  publicar:
    needs: actualizar
    if: ${{ always() && needs.actualizar.result != 'failure' }}
    runs-on: ubuntu-latest
    # Mismo grupo que `procesar.yml`: los despliegues no se pisan. Pero uno nuevo
    # **reemplaza** al anterior en vez de hacer cola detrás de él, porque de un
    # despliegue sólo importa el último. Estuvo en `false` y costó un mes de
    # publicaciones: una corrida del 2026-08-06 se quedó en `waiting` esperando
    # una aprobación que nadie podía dar, y como no se cancelaba, todo lo que
    # entró después al grupo hizo cola y acabó cancelado. `procesar` seguía
    # commiteando y el sitio no se actualizaba. Con `true` esa corrida la
    # reemplaza la siguiente y la cola nunca se atasca.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
