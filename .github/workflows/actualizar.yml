name: Actualizar datos y publicar

on:
  schedule:
    - cron: "0 14 * * 1,4" # lunes y jueves 8:00 Colima
  push:
    branches: [main]
  # Aquí vivía un gatillo `workflow_run` para publicar al terminar un lote. No
  # funciona: el evento no llega nunca (probado el 2026-07-25). Ahora `procesar.yml`
  # publica al final de su propio lote, así que este workflow sólo re-scrapea.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    # El re-scrapeo corre programado o a mano. En push y al terminar un lote de
    # procesamiento sólo se publica: los datos ya están en el repo.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-scrapear el índice de actas
        run: python3 scraper/scrape_colima.py
      - name: Commitear datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/actas.json data/actas.csv site/actas.json site/actas.csv
          git diff --cached --quiet || git commit -m "datos: actualización automática $(date -u +%F)"
          git push

  publicar:
    needs: actualizar
    if: ${{ always() && needs.actualizar.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
