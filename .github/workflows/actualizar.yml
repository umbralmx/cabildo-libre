name: Actualizar datos y publicar

on:
  schedule:
    - cron: "0 14 * * 1,4" # lunes y jueves 8:00 Colima
  push:
    branches: [main]
  # Cuando `procesar.yml` termina un lote, commitea con el GITHUB_TOKEN — y GitHub
  # a propósito NO dispara workflows con los push hechos con ese token. Sin este
  # gatillo, las actas recién procesadas se quedaban en el repo sin llegar al sitio
  # hasta el siguiente lunes o jueves. Se publica, no se re-scrapea.
  workflow_run:
    workflows: ["Procesar actas (Fase 2 — OCR + resúmenes)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    # El re-scrapeo corre programado o a mano. En push y al terminar un lote de
    # procesamiento sólo se publica: los datos ya están en el repo.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-scrapear el índice de actas
        run: python3 scraper/scrape_colima.py
      - name: Commitear datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/actas.json data/actas.csv site/actas.json site/actas.csv
          git diff --cached --quiet || git commit -m "datos: actualización automática $(date -u +%F)"
          git push

  publicar:
    needs: actualizar
    # No republicar si el lote que nos despertó falló a medias.
    if: >-
      ${{ always()
          && needs.actualizar.result != 'failure'
          && (github.event_name != 'workflow_run'
              || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
